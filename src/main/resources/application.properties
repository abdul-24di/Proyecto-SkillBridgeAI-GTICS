spring.application.name=skillb-ia

# --- BASE DE DATOS ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillbridge_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:valar575}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- SESIÓN (Spring Session + JDBC) ---
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# --- THYMELEAF ---
spring.thymeleaf.cache=false


# --- ARCHIVOS SUBIDOS ---
app.storage.type=${APP_STORAGE_TYPE:s3}
app.upload-dir=uploads

# --- AWS S3  ---
aws.s3.bucket=${AWS_S3_BUCKET:skillbridge-ia-archivos}
aws.s3.region=us-east-1
aws.s3.url-base=${AWS_S3_URL_BASE:}





# --- CORREO (SMTP Gmail) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME:}
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=-1

server.tomcat.max-http-form-post-size=15MB
