spring.application.name=skillb-ia

# --- BASE DE DATOS ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillbridge_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=none
# Imprimir cada SQL hace mas lento el servidor. Para depurar en local: SHOW_SQL=true.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
# Si la base de datos esta saturada se responde error rapido, en vez de dejar hilos colgados 30 segundos.
spring.datasource.hikari.connection-timeout=5000

# --- SESIÓN (Spring Session + JDBC) ---
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# --- THYMELEAF ---
# Sin cache, Thymeleaf vuelve a leer cada plantilla en cada visita. Para ver cambios en HTML sin reiniciar: THYMELEAF_CACHE=false.
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}


# --- ARCHIVOS SUBIDOS ---
app.storage.type=${APP_STORAGE_TYPE:s3}
app.upload-dir=uploads

# --- AWS S3  ---
aws.s3.bucket=${AWS_S3_BUCKET:skillbridge-ia-archivos}
aws.s3.region=us-east-1
aws.s3.url-base=${AWS_S3_URL_BASE:}





# --- CORREO (SMTP Gmail) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME:}
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.servlet.multipart.max-file-size=10MB
# El pre-registro del colaborador envia varios archivos a la vez (CV + certificados + formacion), por eso
# el total por peticion es mayor que el limite por archivo (10MB, que cada servicio vuelve a validar).
spring.servlet.multipart.max-request-size=60MB
# Tomcat rechaza por defecto formularios con mas de 50 partes; el pre-registro puede superarlas.
server.tomcat.max-part-count=300
# Lo maximo que Tomcat lee de una subida rechazada para responder el error; sin limite (-1) un atacante
# podria mantener ocupada la conexion enviando datos sin fin.
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-form-post-size=5MB
# Cierra las conexiones que no envian datos (ataque "slowloris").
server.tomcat.connection-timeout=10s
