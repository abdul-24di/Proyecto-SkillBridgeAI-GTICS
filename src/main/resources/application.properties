spring.application.name=skillb-ia

# --- BASE DE DATOS ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillbridge_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
# 'none' porque el schema ya existe (skillbridge_db_v4.sql)
# No dejarlo en 'update' o 'create' para no alterar las tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- THYMELEAF ---
spring.thymeleaf.cache=false

# --- ARCHIVOS SUBIDOS ---
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
# Debe ser mayor que max-file-size por los metadatos del formulario multipart.
spring.servlet.multipart.max-request-size=11MB
# -1 = sin límite para "tragarse" el resto de una subida rechazada. Esto evita que el navegador
# reciba "ERR_CONNECTION_ABORTED" cuando alguien sube un archivo grande: ahora Tomcat sí puede
# leer todo el archivo (aunque lo vaya a rechazar) y devolver el mensaje de error normal.
server.tomcat.max-swallow-size=-1

server.tomcat.max-http-form-post-size=15MB
