spring.application.name=skillb-ia

# --- BASE DE DATOS ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillbridge_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
# 'none' porque el schema ya existe (skillbridge_db_v4.sql)
# No dejarlo en 'update' o 'create' para no alterar las tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- SESIÓN (Spring Session + JDBC) ---
# La sesión HTTP se guarda en MySQL (tablas SPRING_SESSION / SPRING_SESSION_ATTRIBUTES,
# creadas automáticamente) en vez de en memoria del servidor — así sobrevive a un
# reinicio de la app y permitiría repartir carga entre varios servidores.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# --- THYMELEAF ---
spring.thymeleaf.cache=false


# --- ARCHIVOS SUBIDOS ---
# "s3" por defecto (producción). Cualquiera sin credenciales de AWS puede
# probar en su máquina sin tocar este archivo: variable de entorno
# APP_STORAGE_TYPE=local (los archivos se guardan en app.upload-dir).
app.storage.type=${APP_STORAGE_TYPE:s3}
app.upload-dir=uploads

# --- AWS S3  ---
aws.s3.bucket=${AWS_S3_BUCKET:skillbridge-ia-archivos}
aws.s3.region=us-east-1
aws.s3.url-base=${AWS_S3_URL_BASE:}





# --- CORREO (SMTP Gmail) ---
# Si MAIL_USERNAME/MAIL_PASSWORD no estan configurados, EmailService cae de
# vuelta a solo loguear a consola (no se rompe para quien no tenga credenciales).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME:}
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.servlet.multipart.max-file-size=10MB
# Debe ser mayor que max-file-size por los metadatos del formulario multipart.
spring.servlet.multipart.max-request-size=11MB
# -1 = sin límite para "tragarse" el resto de una subida rechazada. Esto evita que el navegador
# reciba "ERR_CONNECTION_ABORTED" cuando alguien sube un archivo grande: ahora Tomcat sí puede
# leer todo el archivo (aunque lo vaya a rechazar) y devolver el mensaje de error normal.
server.tomcat.max-swallow-size=-1

server.tomcat.max-http-form-post-size=15MB
