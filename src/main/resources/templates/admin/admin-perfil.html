<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="../../static/img/skillbridge-icon.png" th:href="@{/img/skillbridge-icon.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkillBridge AI - Mi Perfil</title>
    <link rel="stylesheet" href="../../static/tabler/css/tabler.min.css" th:href="@{/tabler/css/tabler.min.css}">
    <link rel="stylesheet" href="../../static/css/admin-css/admin-common.css" th:href="@{/css/admin-css/admin-common.css}">
    <link rel="stylesheet" href="../../static/css/admin-css/admin-topbar.css" th:href="@{/css/admin-css/admin-topbar.css}">

<style>
  /* Fix para que la foto de perfil no se vea cortada ni con zoom excesivo */
  .avatar {
      object-fit: contain !important;
      object-position: center !important;
      background-color: #f8f9fa; /* Fondo claro para espacios vacíos */
  }
  span.avatar {
      background-size: contain !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-color: #f8f9fa;
  }
  
  /* Si prefieren ver la foto completa sin ningun corte, descomentar contain: */
  /*
  .avatar {
      object-fit: contain !important;
      background-size: contain !important;
      background-repeat: no-repeat !important;
  }
  */
</style>

</head>
<body>
<div class="app-shell">
    <header class="topbar" th:replace="~{fragments/admin-topbar :: topbar('perfil')}"></header>

    <main class="page-wrap">
        <div class="container-xl mt-4">
            <div class="page-header mb-4">
                <div class="row align-items-center">
                    <div class="col">
                        <h2 class="page-title">Configuración de Perfil</h2>
                        <div class="text-secondary mt-1">Administra tu información personal y de seguridad</div>
                    </div>
                </div>
            </div>

            <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
            <div class="alert alert-danger" th:if="${mensajeError}" th:text="${mensajeError}"></div>

            <div class="row">
                <div class="col-md-4 col-lg-3 mb-4">
                    <div class="card">
                        <div class="card-body text-center py-5">

                            <img th:if="${admin.fotoUrl != null and !admin.fotoUrl.isBlank()}"
                                 th:src="@{${admin.fotoUrl}}"
                                 class="avatar avatar-xl mb-4 rounded"
                                 alt="Foto de perfil">

                            <span th:unless="${admin.fotoUrl != null and !admin.fotoUrl.isBlank()}"
                                  class="avatar avatar-xl mb-4 rounded"
                                  style="font-size: 1.5rem;"
                                  th:text="|${#strings.isEmpty(admin.nombre) ? '' : #strings.substring(admin.nombre, 0, 1)}${#strings.isEmpty(admin.apellido) ? '' : #strings.substring(admin.apellido, 0, 1)}|">
                                AD
                            </span>

                            <h3 class="m-o mb-1"
                                th:text="|${admin.nombre != null ? admin.nombre : ''} ${admin.apellido != null ? admin.apellido : ''}|">
                                Nombre del Admin
                            </h3>

                        </div>
                    </div>
                </div>

                <div class="col-md-8 col-lg-9">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Datos de la Cuenta</h3>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/perfil/foto}" method="post" enctype="multipart/form-data">
                                <div class="row g-3">
                                    <div class="col-md-12">
                                        <label class="form-label">Foto de perfil</label>
                                        <input type="file" id="editPhotoInput" class="form-control" name="foto" accept="image/png, image/jpeg" required>
                                        <div class="form-hint">Formatos JPG o PNG, máximo 2MB.</div>
                                    </div>
                                </div>
                                <div class="mt-3 d-flex justify-content-end">
                                    <button type="submit" class="btn btn-primary">Guardar foto</button>
                                </div>
                            </form>

                            <hr>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nombres</label>
                                    <input type="text" class="form-control" th:value="${admin.nombre}" readonly disabled>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Apellidos</label>
                                    <input type="text" class="form-control" th:value="${admin.apellido}" readonly disabled>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Correo electrónico</label>
                                    <input type="email" class="form-control" th:value="${admin.correo}" readonly disabled>
                                    <div class="form-hint">El correo es tu identificador de acceso.</div>
                                </div>
                            </div>

                            <form th:action="@{/admin/perfil/telefono}" method="post" class="row g-3 mt-1" th:object="${telefonoPerfilForm}" novalidate>
                                <div class="col-md-12">
                                    <label class="form-label">Teléfono</label>
                                    <input type="tel" class="form-control" th:field="*{telefono}" th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'" maxlength="20" placeholder="Ejemplo: +51987654321">
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                                    <div class="form-hint" th:unless="${#fields.hasErrors('telefono')}">Solo dígitos y un + inicial opcional.</div>
                                </div>
                                <div class="col-12 d-flex justify-content-end">
                                    <button type="submit" class="btn btn-primary">Guardar teléfono</button>
                                </div>
                            </form>

                            <div class="col-12 mt-4">
                                <h4 class="form-label">Seguridad</h4>
                                <div class="hr-text mt-0 mb-3">Cambiar contraseña</div>
                            </div>

                            <form th:action="@{/admin/perfil/password}" method="post" class="row g-3" th:object="${passwordPerfilForm}" novalidate>
                                <div class="col-md-4">
                                    <label class="form-label">Contraseña actual</label>
                                    <input type="password" class="form-control" th:field="*{passwordActual}" th:classappend="${#fields.hasErrors('passwordActual')} ? 'is-invalid'">
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('passwordActual')}" th:errors="*{passwordActual}"></div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Nueva Contraseña</label>
                                    <input type="password" class="form-control" th:field="*{passwordNueva}" th:classappend="${#fields.hasErrors('passwordNueva')} ? 'is-invalid'">
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('passwordNueva')}" th:errors="*{passwordNueva}"></div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Confirmar Contraseña</label>
                                    <input type="password" class="form-control" th:field="*{passwordConfirm}" th:classappend="${#fields.hasErrors('passwordConfirm') or #fields.hasErrors('passwordsCoinciden')} ? 'is-invalid'">
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('passwordsCoinciden')}" th:errors="*{passwordsCoinciden}"></div>
                                </div>
                                <div class="col-12 d-flex justify-content-end">
                                    <button type="submit" class="btn btn-primary">Cambiar contraseña</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="../../static/tabler/js/tabler.min.js" th:src="@{/tabler/js/tabler.min.js}"></script>
<script th:src="@{/js/validacion-formularios.js}"></script>
</body>
</html>
