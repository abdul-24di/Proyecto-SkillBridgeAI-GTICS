<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Iniciar sesión | SkillBridge AI</title>

    <!-- Tabler -->
    <link rel="stylesheet"
          href="../../static/tabler/css/tabler.min.css"
          th:href="@{/tabler/css/tabler.min.css}">

    <!-- Estilos SkillBridge -->
    <link rel="stylesheet"
          href="../../static/css/login.css"
          th:href="@{/css/login.css}">
</head>

<body class="d-flex flex-column login-page login-classic">

<div class="page page-center">

    <div class="container container-tight py-4">

        <!-- LOGO -->
        <div class="text-center mb-4">

            <div class="skillbridge-logo mx-auto mb-3">
                SB
            </div>

            <h1 class="h2 mb-1">
                SkillBridge AI
            </h1>

            <p class="text-secondary mb-0">
                Gestión inteligente de talento y proyectos
            </p>

        </div>


        <!-- LOGIN -->
        <div class="card card-md login-card">

            <div class="card-body">

                <h2 class="h2 text-center mb-2">
                    Bienvenido
                </h2>

                <p class="text-secondary text-center mb-4">
                    Ingresa tus credenciales para continuar
                </p>


                <!-- ERROR SPRING SECURITY -->
                <div class="alert alert-danger"
                     th:if="${param.error}">
                    Correo o contraseña incorrectos.
                </div>

                <!-- LOGOUT -->
                <div class="alert alert-success"
                     th:if="${param.logout}">
                    Has cerrado sesión correctamente.
                </div>


                <form th:action="@{/login}"
                      action="/login"
                      method="post">

                    <!-- CORREO -->
                    <div class="mb-3">

                        <label class="form-label">
                            Correo institucional
                        </label>

                        <input type="email"
                               class="form-control"
                               name="username"
                               placeholder="nombre@empresa.com"
                               autocomplete="email"
                               required>

                    </div>


                    <!-- CONTRASEÑA -->
                    <div class="mb-3">

                        <div class="d-flex justify-content-between">

                            <label class="form-label">
                                Contraseña
                            </label>

                            <a href="#">
                                ¿Olvidaste tu contraseña?
                            </a>

                        </div>

                        <input type="password"
                               class="form-control"
                               name="password"
                               placeholder="Ingresa tu contraseña"
                               autocomplete="current-password"
                               required>

                    </div>


                    <!-- RECORDAR -->
                    <div class="mb-3">

                        <label class="form-check">

                            <input type="checkbox"
                                   class="form-check-input"
                                   name="remember-me">

                            <span class="form-check-label">
                                Mantener sesión iniciada
                            </span>

                        </label>

                    </div>


                    <div class="form-footer">

                        <button type="submit"
                                class="btn btn-primary w-100">

                            Iniciar sesión

                        </button>

                    </div>

                </form>

            </div>

        </div>


        <div class="text-center text-secondary mt-3">
            SkillBridge AI · 2026
        </div>

    </div>

</div>


<script src="../../static/tabler/js/tabler.min.js"
        th:src="@{/tabler/js/tabler.min.js}">
</script>

</body>
</html>
