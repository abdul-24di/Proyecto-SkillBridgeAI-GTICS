<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="../../static/img/skillbridge-icon.png" th:href="@{/img/skillbridge-icon.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva contraseña | SkillBridge AI</title>
    <link rel="stylesheet" href="../../static/tabler/css/tabler.min.css" th:href="@{/tabler/css/tabler.min.css}">
    <link rel="stylesheet" href="../../static/css/auth-css/auth.css" th:href="@{/css/auth-css/auth.css}">

<style>
  /* Fix para que la foto de perfil no se vea cortada ni con zoom excesivo */
  .avatar {
      object-fit: contain !important;
      object-position: center !important;
      background-color: #f8f9fa; /* Fondo claro para espacios vacíos */
  }
  span.avatar {
      background-size: contain !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-color: #f8f9fa;
  }
  
  /* Si prefieren ver la foto completa sin ningun corte, descomentar contain: */
  /*
  .avatar {
      object-fit: contain !important;
      background-size: contain !important;
      background-repeat: no-repeat !important;
  }
  */
</style>

</head>
<body class="auth-page">
<div class="auth-shell">

    <div class="auth-brand">
        <img class="auth-logo-img" src="../../static/img/skillbridge-logo.webp" th:src="@{/img/skillbridge-logo.webp}" alt="SkillBridge AI">
        <p>Gestión inteligente de talento y proyectos</p>
    </div>

    <div class="auth-card">

        <a href="recuperar-contrasena.html" class="auth-back" th:href="@{/recuperar}">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            Volver
        </a>

        <div class="auth-icon-badge bg-success-soft">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </div>

        <h2 class="auth-title">Nueva contraseña</h2>
        <p class="auth-subtitle">Identidad verificada. Crea una nueva contraseña para tu cuenta.</p>

        <div class="auth-alert error" th:if="${param.error}">El enlace ya no es válido o expiró. Solicita uno nuevo.</div>

        <form class="auth-form" id="resetForm" th:action="@{/nueva-contrasena}" method="post" th:object="${nuevaContrasenaForm}" novalidate>
            <input type="hidden" th:field="*{token}">

            <div class="mb-3">
                <label class="form-label" for="newPassword">Nueva contraseña</label>
                <div class="auth-input-icon">
                    <span class="auth-input-icon-addon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                    </span>
                    <input id="newPassword" th:field="*{password}" type="password" class="form-control" placeholder="Mínimo 8 caracteres, con mayúscula, número y símbolo">
                    <button type="button" class="auth-toggle-visibility" data-toggle-password="newPassword" aria-label="Mostrar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <div class="auth-field-error is-visible" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="confirmNewPassword">Confirmar contraseña</label>
                <div class="auth-input-icon">
                    <span class="auth-input-icon-addon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                    </span>
                    <input id="confirmNewPassword" th:field="*{confirmarPassword}" type="password" class="form-control" placeholder="Repite la nueva contraseña">
                    <button type="button" class="auth-toggle-visibility" data-toggle-password="confirmNewPassword" aria-label="Mostrar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <div class="auth-field-error is-visible" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></div>
                <div class="auth-field-error is-visible" th:if="${#fields.hasErrors('passwordsCoinciden')}" th:errors="*{passwordsCoinciden}"></div>
            </div>

            <button type="submit" class="auth-submit">Guardar nueva contraseña</button>

        </form>

    </div>

    <div class="auth-copyright">© 2026 SkillBridge AI — TEL137 PUCP</div>

</div>

<script src="../../static/tabler/js/tabler.min.js" th:src="@{/tabler/js/tabler.min.js}"></script>
<script src="../../static/js/auth-js/auth.js" th:src="@{/js/auth-js/auth.js}"></script>
</body>
</html>
