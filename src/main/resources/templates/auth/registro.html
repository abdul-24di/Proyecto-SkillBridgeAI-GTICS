<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta | SkillBridge AI</title>
    <link rel="stylesheet" href="../../static/tabler/css/tabler.min.css" th:href="@{/tabler/css/tabler.min.css}">
    <link rel="stylesheet" href="../../static/css/auth-css/auth.css" th:href="@{/css/auth-css/auth.css}">
</head>
<body class="auth-page">
<div class="auth-shell" style="max-width:560px">

    <div class="auth-brand">
        <div class="auth-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/>
            </svg>
        </div>
        <h1>SkillBridge AI</h1>
        <p>Gestión inteligente de talento y proyectos</p>
    </div>

    <div class="auth-card">

        <div class="auth-card-header">
            <a href="login.html" class="auth-back" th:href="@{/login}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                Volver al inicio de sesión
            </a>

            <div class="auth-icon-badge">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
            </div>
        </div>

        <h2 class="auth-title">Crear cuenta</h2>
        <p class="auth-subtitle">Regístrate para empezar a gestionar tus proyectos y equipos.</p>

        <div id="registerAlertBox"></div>

        <form class="auth-form" id="registerForm" data-redirect="login.html" novalidate>

            <div class="row-2 mb-3">
                <div>
                    <label class="form-label" for="regFirstName">Nombre</label>
                    <div class="auth-input-icon">
                        <span class="auth-input-icon-addon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6"/></svg>
                        </span>
                        <input id="regFirstName" type="text" class="form-control" placeholder="Juan" required>
                    </div>
                </div>
                <div>
                    <label class="form-label" for="regLastName">Apellido</label>
                    <input id="regLastName" type="text" class="form-control" placeholder="Pérez" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="regEmail">Correo electrónico</label>
                <div class="auth-input-icon">
                    <span class="auth-input-icon-addon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                    </span>
                    <input id="regEmail" type="email" class="form-control" placeholder="nombre@empresa.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="regPhone">Teléfono</label>
                <div class="auth-input-icon">
                    <span class="auth-input-icon-addon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L7.9 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2.3z"/></svg>
                    </span>
                    <input id="regPhone" type="tel" class="form-control" placeholder="+51 999 888 777">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="regUserType">Tipo de usuario</label>
                <select id="regUserType" class="form-select">
                    <option>Project Manager</option>
                    <option>Resource Manager</option>
                    <option>Colaborador</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label" for="regPassword">Contraseña</label>
                <div class="auth-input-icon">
                    <span class="auth-input-icon-addon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                    </span>
                    <input id="regPassword" type="password" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
                    <button type="button" class="auth-toggle-visibility" data-toggle-password="regPassword" aria-label="Mostrar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="regConfirmPassword">Confirmar contraseña</label>
                <div class="auth-input-icon">
                    <span class="auth-input-icon-addon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                    </span>
                    <input id="regConfirmPassword" type="password" class="form-control" placeholder="Repite la contraseña" minlength="6" required>
                    <button type="button" class="auth-toggle-visibility" data-toggle-password="regConfirmPassword" aria-label="Mostrar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-submit">

                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
                Crear cuenta
            </button>

        </form>

        <hr class="auth-divider">

        <div class="auth-footer-line">¿Ya tienes cuenta? <a href="login.html" class="auth-link" th:href="@{/login}">Inicia sesión</a></div>

    </div>

    <div class="auth-copyright">© 2026 SkillBridge AI — TEL137 PUCP</div>

</div>

<script src="../../static/tabler/js/tabler.min.js" th:src="@{/tabler/js/tabler.min.js}"></script>
<script src="../../static/js/auth-js/auth.js" th:src="@{/js/auth-js/auth.js}"></script>
</body>
</html>
