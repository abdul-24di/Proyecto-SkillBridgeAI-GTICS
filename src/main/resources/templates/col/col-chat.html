<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="../../static/img/skillbridge-icon.png" th:href="@{/img/skillbridge-icon.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkillBridge AI — Chat</title>
    <link rel="stylesheet" href="../../static/tabler/css/tabler.min.css" th:href="@{/tabler/css/tabler.min.css}">
    <link rel="stylesheet" href="../../static/css/col-css/col-common.css" th:href="@{/css/col-css/col-common.css}">
    <link rel="stylesheet" href="../../static/css/pm-css/pm-chat.css" th:href="@{/css/pm-css/pm-chat.css}">
    <link rel="stylesheet" href="../../static/css/col-css/col-topbar.css" th:href="@{/css/col-css/col-topbar.css}">

<style>
  /* Fix para que la foto de perfil no se vea cortada ni con zoom excesivo */
  .avatar {
      object-fit: contain !important;
      object-position: center !important;
      background-color: #f8f9fa; /* Fondo claro para espacios vacíos */
  }
  span.avatar {
      background-size: contain !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-color: #f8f9fa;
  }
  
  /* Si prefieren ver la foto completa sin ningun corte, descomentar contain: */
  /*
  .avatar {
      object-fit: contain !important;
      background-size: contain !important;
      background-repeat: no-repeat !important;
  }
  */
</style>

</head>
<body>
<div class="app-shell">

<header class="topbar" th:replace="~{fragments/col-topbar :: topbar('chat')}"></header>

<main class="page-wrap">
    <div class="breadcrumb-wrap">
        <a th:href="@{/colaborador/proyectos}" class="breadcrumb-link">Mis Proyectos</a>
        <span class="breadcrumb-separator">›</span>
        <span class="text-secondary">Chat</span>
    </div>

    <div class="chat-layout">
        <aside class="card section-card channel-panel">
            <div class="card-header section-header">
                <div><h3 class="card-title mb-1">Canales</h3></div>
            </div>
            <div class="channel-list">
                <div class="channel-group-label" th:if="${not #lists.isEmpty(proyectos)}">Proyectos Activos</div>
                
                <button th:each="proy : ${proyectos}" 
                        class="channel-item" 
                        th:classappend="${proy.id == proyectoIdSeleccionado} ? 'active' : ''"
                        th:data-channel-id="${proy.id}" 
                        th:data-channel-name="${proy.nombre}"
                        th:text="'# ' + ${proy.nombre}">
                    # Nombre Proyecto
                </button>
                
                <div th:if="${#lists.isEmpty(proyectos)}" class="text-secondary small p-3 text-center">
                    No estás asignado a ningún proyecto actualmente.
                </div>
            </div>
        </aside>

        <section class="card section-card chat-panel">
            <div th:if="${proyectoIdSeleccionado == null and not #lists.isEmpty(proyectos)}" class="d-flex align-items-center justify-content-center h-100 text-secondary">
                Selecciona un canal de la izquierda para comenzar a chatear.
            </div>
            
            <div th:if="${proyectoIdSeleccionado != null}" class="d-flex flex-column h-100">
                <div class="chat-header">
                    <div>
                        <div class="fw-bold fs-3" id="channelTitle"># Cargando...</div>
                        <div class="small text-secondary">Chat grupal del equipo (PM + Colaboradores)</div>
                    </div>
                </div>
                
                <div id="messageList" class="message-list flex-fill overflow-auto">
                    <!-- Los mensajes se cargarán por AJAX -->
                    <div class="text-center py-5 text-secondary">Cargando mensajes...</div>
                </div>
                
                <form id="chatForm" class="chat-composer mt-3">
                    <input type="hidden" id="activeProjectId" th:value="${proyectoIdSeleccionado}">
                    <input id="messageInput" class="form-control me-2" placeholder="Escribe un mensaje al equipo" autocomplete="off">
                    <button type="submit" class="btn btn-primary" id="btnEnviar">Enviar</button>
                </form>
            </div>
            
            <div th:if="${#lists.isEmpty(proyectos)}" class="d-flex align-items-center justify-content-center h-100 text-secondary">
                No tienes proyectos disponibles para chatear.
            </div>
        </section>
    </div>
</main>
</div>

<script src="../../static/tabler/js/tabler.min.js" th:src="@{/tabler/js/tabler.min.js}"></script>

<!-- Scripts para AJAX Chat -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const channelButtons = document.querySelectorAll('.channel-item');
    let activeProjectId = document.getElementById('activeProjectId') ? document.getElementById('activeProjectId').value : null;
    const messageList = document.getElementById('messageList');
    const channelTitle = document.getElementById('channelTitle');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const btnEnviar = document.getElementById('btnEnviar');
    let chatInterval = null;

    if (activeProjectId && channelTitle) {
        // Find active button to set title
        const activeButton = document.querySelector(`.channel-item[data-channel-id='${activeProjectId}']`);
        if(activeButton) channelTitle.textContent = '# ' + activeButton.dataset.channelName;
        
        loadMessages();
        chatInterval = setInterval(loadMessages, 3000); // Polling cada 3 segundos
    }

    channelButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            window.location.href = `/colaborador/chat?proyectoId=${this.dataset.channelId}`;
        });
    });

    if(chatForm) {
        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if(!text || !activeProjectId) return;
            
            btnEnviar.disabled = true;
            
            const formData = new URLSearchParams();
            formData.append('proyectoId', activeProjectId);
            formData.append('contenido', text);

            fetch('/colaborador/api/chat/enviar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            })
            .then(res => {
                if(!res.ok) throw new Error("Error enviando mensaje");
                return res.json();
            })
            .then(msg => {
                messageInput.value = '';
                loadMessages(); // reload to show new msg
            })
            .catch(err => {
                console.error(err);
                alert("No se pudo enviar el mensaje");
            })
            .finally(() => {
                btnEnviar.disabled = false;
                messageInput.focus();
            });
        });
    }

    function loadMessages() {
        if(!activeProjectId) return;
        
        fetch(`/colaborador/api/chat/mensajes?proyectoId=${activeProjectId}`)
        .then(res => res.json())
        .then(data => {
            renderMessages(data);
        })
        .catch(console.error);
    }

    function renderMessages(messages) {
        if(messages.length === 0) {
            messageList.innerHTML = '<div class="text-center py-5 text-secondary">Aún no hay mensajes en este chat.</div>';
            return;
        }

        let html = '';
        messages.forEach(msg => {
            if(msg.esPropio) {
                html += `
                <div class="message-row own">
                    <div>
                        <div class="message-meta">
                            <strong>${escapeHtml(msg.autorNombre)}</strong>
                            <span>${msg.hora}</span>
                        </div>
                        <div class="message-bubble">${escapeHtml(msg.contenido)}</div>
                    </div>
                    <span class="avatar avatar-sm bg-blue text-white">${escapeHtml(msg.autorIniciales)}</span>
                </div>`;
            } else {
                html += `
                <div class="message-row">
                    <span class="avatar avatar-sm bg-blue-lt text-blue">${escapeHtml(msg.autorIniciales)}</span>
                    <div>
                        <div class="message-meta">
                            <strong>${escapeHtml(msg.autorNombre)}</strong>
                            <span>${msg.hora}</span>
                        </div>
                        <div class="message-bubble bg-light">${escapeHtml(msg.contenido)}</div>
                    </div>
                </div>`;
            }
        });

        const wasAtBottom = isScrollAtBottom(messageList);
        messageList.innerHTML = html;
        if(wasAtBottom) {
            scrollToBottom(messageList);
        }
    }

    function escapeHtml(unsafe) {
        return (unsafe || '').toString()
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
    }

    function isScrollAtBottom(el) {
        return el.scrollHeight - el.scrollTop <= el.clientHeight + 50;
    }

    function scrollToBottom(el) {
        el.scrollTop = el.scrollHeight;
    }
});
</script>
</body>
</html>
