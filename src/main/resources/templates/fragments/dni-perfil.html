<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  DNI en el perfil de cualquier rol. Si ya está registrado se muestra fijo (no se edita).
  Si el usuario no tiene DNI (cuentas creadas antes de pedirlo), puede registrarlo una sola vez.
  Uso: <div th:replace="~{fragments/dni-perfil :: dni(${colaborador})}"></div>
-->
<div th:fragment="dni(usuario)" class="dni-perfil mb-3" id="dni">
  <div class="hr-text mt-2 mb-3">Documento de identidad</div>

  <div class="alert alert-success py-2" th:if="${dniGuardado != null}" th:text="${dniGuardado}">DNI registrado.</div>

  <div th:if="${usuario.dni != null and !#strings.isEmpty(usuario.dni)}" class="row g-3">
    <div class="col-md-6">
      <label class="form-label d-flex align-items-center gap-2">
        DNI
        <span class="badge bg-green-lt text-green" th:if="${usuario.dniVerificado}">Verificado</span>
        <span class="badge bg-yellow-lt text-yellow" th:unless="${usuario.dniVerificado}">Sin verificar</span>
      </label>
      <input type="text" class="form-control" th:value="${usuario.dni}" readonly disabled>
      <div class="form-hint">El DNI no se puede modificar.</div>
    </div>
  </div>

  <form th:unless="${usuario.dni != null and !#strings.isEmpty(usuario.dni)}"
        th:action="@{/perfil/dni}" method="post" class="row g-3" novalidate>
    <div class="col-12">
      <div class="alert alert-warning py-2 mb-0">
        Tu cuenta aún no tiene DNI registrado. Regístralo una sola vez: después no podrás cambiarlo.
      </div>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="dniPerfil">DNI</label>
      <input id="dniPerfil" type="text" name="dni" inputmode="numeric" maxlength="8" class="form-control"
             th:classappend="${dniError != null} ? 'is-invalid'" th:value="${dniIngresado}" placeholder="Ejemplo: 45678912">
      <div class="invalid-feedback d-block" th:if="${dniError != null}" th:text="${dniError}"></div>
      <div class="form-hint" th:if="${dniError == null}">Se comprueba con tu nombre registrado.</div>
    </div>
    <div class="col-md-6 d-flex align-items-end">
      <button type="submit" class="btn btn-primary">Registrar DNI</button>
    </div>
  </form>
</div>
</body>
</html>
