<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Paginación hecha en el servidor (Page<T> de Spring Data), sin JavaScript.
  Los botones envían el formulario GET de filtros (atributo form="...") con
  name="pagina", así se conservan los filtros al cambiar de página.

  Uso:
    <form id="filtrosUsuarios" method="get" th:action="@{/admin/usuarios}"> ...filtros... </form>
    <div th:replace="~{fragments/paginacion :: paginacion(${pagina}, 'filtrosUsuarios', 'usuario(s)', 'pagina')}"></div>
  El último parámetro es el nombre del parámetro de página (útil si hay dos tablas en la misma vista).
-->
<div th:fragment="paginacion(pagina, formId, etiqueta, parametro)" class="pagination-wrap d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3"
     th:with="actual=${pagina.number + 1},
              desde=${pagina.totalElements == 0 ? 0 : pagina.number * pagina.size + 1},
              hasta=${pagina.number * pagina.size + pagina.numberOfElements}">
    <div class="text-secondary small"
         th:text="|Mostrando ${desde}-${hasta} de ${pagina.totalElements} ${etiqueta}|">Mostrando 1-10 de 20</div>
    <ul class="pagination pagination-sm m-0" th:if="${pagina.totalPages > 1}">
        <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
            <button type="submit" class="page-link" th:form="${formId}" th:name="${parametro}" th:value="${actual - 1}"
                    th:disabled="${pagina.first}">Anterior</button>
        </li>
        <li class="page-item" th:each="n : ${#numbers.sequence(1, pagina.totalPages)}" th:classappend="${n == actual} ? 'active'">
            <button type="submit" class="page-link" th:form="${formId}" th:name="${parametro}" th:value="${n}" th:text="${n}">1</button>
        </li>
        <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
            <button type="submit" class="page-link" th:form="${formId}" th:name="${parametro}" th:value="${actual + 1}"
                    th:disabled="${pagina.last}">Siguiente</button>
        </li>
    </ul>
</div>
</body>
</html>
