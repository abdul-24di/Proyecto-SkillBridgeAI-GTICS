<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="topbar" th:fragment="topbar(activeSection)">
  <div class="container-xl">
    <a href="#" class="brand">SkillBridge AI</a>

    <nav class="main-nav" aria-label="Navegación principal">
      <a href="#"
         th:classappend="${activeSection == 'dashboard'} ? 'active' : ''">
        Dashboard
      </a>
      <a href="#"
         th:classappend="${activeSection == 'proyectos'} ? 'active' : ''">
        Proyectos
      </a>
      <a href="#"
         th:classappend="${activeSection == 'colaboradores'} ? 'active' : ''">
        Colaboradores
      </a>
      <a href="#"
         th:classappend="${activeSection == 'asignaciones'} ? 'active' : ''">
        Asignaciones
      </a>
      <a href="#"
         th:classappend="${activeSection == 'talent-matching'} ? 'active' : ''">
        Talent Matching
      </a>
    </nav>

    <div class="user-area">
      <a href="#"
         class="notification-link position-relative"
         aria-label="Notificaciones">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="20"
             height="20"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M10 5a2 2 0 0 1 4 0 7 7 0 0 1 4 6v3l2 2H4l2-2v-3a7 7 0 0 1 4-6"/>
          <path d="M9 19a3 3 0 0 0 6 0"/>
        </svg>
        <span class="badge bg-red notification-dot"></span>
      </a>

      <span class="avatar avatar-sm user-avatar">AR</span>

      <div class="user-meta">
        <div class="fw-semibold">Abraham Ramirez</div>
        <div class="small">Resource Manager</div>
      </div>
    </div>
  </div>
</header>

</body>
</html>
