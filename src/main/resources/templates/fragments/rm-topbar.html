<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header class="topbar" th:fragment="topbar(activeSection)">
  <div class="container-xl">
    <a href="../rm/rm-dashboard.html" class="brand" th:href="@{/rm/dashboard}">SkillBridge AI</a>

    <nav class="main-nav" aria-label="Navegacion principal" sec:authorize="hasRole('RESOURCE_MANAGER')">
      <a href="../rm/rm-dashboard.html"
         th:classappend="${activeSection == 'dashboard'} ? 'active' : ''" th:href="@{/rm/dashboard}">Dashboard</a>
      <a href="../rm/rm-proyectos.html"
         th:classappend="${activeSection == 'proyectos'} ? 'active' : ''" th:href="@{/rm/proyectos}">Proyectos</a>
      <a href="../rm/rm-colaboradores.html"
         th:classappend="${activeSection == 'colaboradores'} ? 'active' : ''" th:href="@{/rm/colaboradores}">Colaboradores</a>
      <a href="../rm/rm-asignaciones.html"
         th:classappend="${activeSection == 'asignaciones'} ? 'active' : ''" th:href="@{/rm/asignaciones}">Asignaciones</a>
      <a href="../rm/rm-cursos.html"
         th:classappend="${activeSection == 'cursos'} ? 'active' : ''" th:href="@{/rm/cursos}">Cursos</a>
      <a href="../rm/rm-talent-matching.html"
         th:classappend="${activeSection == 'talent-matching'} ? 'active' : ''" th:href="@{/rm/talent-matching}">Talent Matching</a>
      <a href="../rm/rm-foros.html"
         th:classappend="${activeSection == 'foros'} ? 'active' : ''" th:href="@{/rm/foros}">Foros</a>
      <a href="../rm/rm-reporte-recursos.html"
         th:classappend="${activeSection == 'reportes'} ? 'active' : ''" th:href="@{/rm/reportes/recursos}">Reportes</a>
    </nav>

    <div class="user-area">
      <a href="#" class="notification-link position-relative" aria-label="Notificaciones">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 5a2 2 0 0 1 4 0 7 7 0 0 1 4 6v3l2 2H4l2-2v-3a7 7 0 0 1 4-6"/>
          <path d="M9 19a3 3 0 0 0 6 0"/>
        </svg>
        <span class="badge bg-red notification-dot"></span>
      </a>
      <a href="../rm/rm-perfil.html" th:href="@{/rm/perfil}" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
        <span th:if="${rm?.fotoUrl != null and !rm.fotoUrl.isEmpty()}" class="avatar avatar-sm user-avatar" th:style="'background-image: url(' + @{${rm.fotoUrl}} + ')'"></span>
        <span th:unless="${rm?.fotoUrl != null and !rm.fotoUrl.isEmpty()}" class="avatar avatar-sm user-avatar" th:text="|${#strings.isEmpty(rm?.nombre) ? '' : #strings.substring(rm.nombre, 0, 1)}${#strings.isEmpty(rm?.apellido) ? '' : #strings.substring(rm.apellido, 0, 1)}|">AR</span>
        <div class="user-meta"><div class="fw-semibold" th:text="|${rm?.nombre} ${rm?.apellido}|">Abraham Ramirez</div><div class="small">Resource Manager</div></div>
      </a><a href="/logout" th:href="@{/logout}" class="btn btn-danger btn-sm ms-3" title="Cerrar sesión" style="padding: 4px 8px; display: flex; align-items: center; gap: 4px;">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
    <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"></path>
    <path d="M9 12h12l-3 -3"></path>
    <path d="M18 15l3 -3"></path>
  </svg>
  Salir
</a>
</div>  </div>
  <script th:src="@{/js/notificaciones.js}" src="../static/js/notificaciones.js"></script>
</header>

</body>
</html>
