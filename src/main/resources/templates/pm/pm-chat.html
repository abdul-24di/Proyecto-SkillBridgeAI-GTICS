<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="../../static/img/skillbridge-icon.png" th:href="@{/img/skillbridge-icon.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkillBridge AI — Chat</title>
    <link rel="stylesheet" href="../../static/tabler/css/tabler.min.css" th:href="@{/tabler/css/tabler.min.css}">
    <link rel="stylesheet" href="../../static/css/pm-css/pm-common.css" th:href="@{/css/pm-css/pm-common.css}">
    <link rel="stylesheet" href="../../static/css/chat.css" th:href="@{/css/chat.css}">
    <link rel="stylesheet" href="../../static/css/pm-css/pm-topbar.css" th:href="@{/css/pm-css/pm-topbar.css}">
</head>
<body>
<div class="app-shell">

    <header class="topbar" th:replace="~{fragments/pm-topbar :: topbar('chat')}"></header>

    <main class="page-wrap">
        <div class="breadcrumb-wrap">
            <a th:href="@{/pm/proyectos}" class="breadcrumb-link">Mis Proyectos</a>
            <span class="breadcrumb-separator">›</span>
            <span class="text-secondary">Chat</span>
        </div>

        <div class="sb-chat" id="chatApp" data-api-base="/pm/api/chat" data-page-url="/pm/chat"
             th:data-project-id="${proyectoIdSeleccionado}" th:data-user-id="${usuarioIdSeleccionado}">
            <aside class="sb-chat__sidebar">
                <div class="sb-chat__picker" th:if="${not #lists.isEmpty(proyectos)}">
                    <label class="sb-chat__label" for="proyectoSelect">Proyecto</label>
                    <select id="proyectoSelect" class="form-select">
                        <option value="" disabled th:selected="${proyectoIdSeleccionado == null}">Selecciona un proyecto</option>
                        <option th:each="proy : ${proyectos}" th:value="${proy.id}" th:text="${proy.nombre}"
                                th:selected="${proy.id == proyectoIdSeleccionado}">Proyecto</option>
                    </select>
                </div>
                <div th:if="${proyectoIdSeleccionado != null}" id="contactList" class="sb-chat__list" aria-label="Conversaciones"></div>
            </aside>

            <section class="sb-chat__panel">
                <div th:if="${proyectoIdSeleccionado != null}" class="d-flex flex-column h-100" style="min-height:0">
                    <header class="sb-chat__header">
                        <span class="sb-avatar sb-avatar--lg sb-avatar--group" id="chatAvatar" aria-hidden="true"></span>
                        <div class="sb-chat__header-text">
                            <h2 class="sb-chat__title" id="chatTitulo"><th:block th:each="p : ${proyectos}"><th:block th:if="${p.id == proyectoIdSeleccionado}" th:text="${p.nombre}">Proyecto</th:block></th:block></h2>
                            <p class="sb-chat__subtitle" id="chatSubtitulo">Chat del equipo</p>
                        </div>
                        <span class="sb-chat__status" id="chatEstadoConexion" hidden>Sin conexión</span>
                    </header>

                    <div id="messageList" class="sb-chat__messages" role="log" aria-live="polite"></div>

                    <div id="chatError" class="sb-chat__alert" role="alert" hidden></div>
                    <form id="chatForm" class="sb-chat__composer" novalidate>
                        <input id="messageInput" type="text" maxlength="1000" autocomplete="off"
                               placeholder="Escribe un mensaje…" aria-label="Mensaje">
                        <button type="submit" class="sb-chat__send" id="btnEnviar" aria-label="Enviar mensaje">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </form>
                </div>

                <div th:if="${proyectoIdSeleccionado == null}" class="sb-state">
                    <div class="sb-state__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                    <h3 th:text="${#lists.isEmpty(proyectos)} ? 'Aún no tienes chats' : 'Elige un proyecto'">Elige un proyecto</h3>
                    <p th:text="${#lists.isEmpty(proyectos)} ? 'Cuando participes en un proyecto activo, su chat aparecerá aquí.' : 'Selecciona un proyecto para ver sus conversaciones.'">Selecciona un proyecto para ver sus conversaciones.</p>
                </div>
            </section>
        </div>
    </main>
</div>

<script src="../../static/tabler/js/tabler.min.js" th:src="@{/tabler/js/tabler.min.js}"></script>
<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="../../static/js/chat.js" th:src="@{/js/chat.js}"></script>

</body>
</html>
