<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkillBridge AI - Reportes de Proyectos</title>
    <link rel="stylesheet" href="../../static/tabler/css/tabler.min.css" th:href="@{/tabler/css/tabler.min.css}">
    <link rel="stylesheet" href="../../static/css/pm-css/pm-common.css" th:href="@{/css/pm-css/pm-common.css}">
    <link rel="stylesheet" href="../../static/css/pm-css/pm-topbar.css" th:href="@{/css/pm-css/pm-topbar.css}">
</head>
<body>
<div class="app-shell">

    <header class="topbar" th:replace="~{fragments/pm-topbar :: topbar('reportes')}"></header>

    <main class="page-wrap">
        <div class="container-xl mt-4">
            <div class="page-header mb-4">
                <div class="row align-items-center">
                    <div class="col">
                        <h2 class="page-title">Reportes de Proyectos</h2>
                        <div class="text-secondary mt-1">Selecciona un proyecto para visualizar sus métricas, estado y desempeño del equipo.</div>
                    </div>
                </div>
            </div>

            <div class="row row-cards">

                <!-- Reportes Iterados Dinámicamente -->
                <div th:each="proy : ${proyectos}" class="col-md-6 col-lg-4 pm-report-item">
                    <div class="card card-link-pop h-100">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex align-items-center mb-3">
                                <span class="avatar bg-blue-lt rounded" th:text="${#strings.substring(proy.proyecto.nombre,0,2).toUpperCase()}">PR</span>
                                <h3 class="card-title m-0 ms-3" th:text="${proy.proyecto.nombre}">Nombre de Proyecto</h3>
                            </div>
                            <div class="progress mb-2">
                                <div class="progress-bar"
                                     th:classappend="${proy.progresoActividades == 100 ? 'bg-success' : 'bg-primary'}"
                                     th:style="'width: ' + ${proy.progresoActividades} + '%'"
                                     role="progressbar"></div>
                            </div>
                            <div class="d-flex justify-content-between text-secondary mb-3 small">
                                <span>Progreso de actividades</span>
                                <span th:text="${proy.progresoActividades} + '%'">0%</span>
                            </div>

                            <div class="mt-auto d-flex justify-content-between align-items-center pt-3 border-top">
                                <span class="badge" th:classappend="${proy.estadoClase}" th:text="${proy.estadoTexto}">ESTADO</span>
                                <a th:href="@{/pm/reportes/detalle(proyectoId=${proy.proyecto.id})}" class="btn btn-outline-primary btn-sm">Ver reporte detallado</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(proyectos)}" class="col-12 text-center text-secondary py-5">
                    No gestionas ningún proyecto por el momento.
                </div>

            </div>

            <div class="pagination-wrap">
                <div id="reportesPaginationInfo" class="text-secondary small">Mostrando proyectos</div>
                <ul id="reportesPagination" class="pagination pagination-sm m-0"></ul>
            </div>
        </div>
    </main>

</div>
<script src="../../static/tabler/js/tabler.min.js" th:src="@{/tabler/js/tabler.min.js}"></script>
<script src="../../static/js/pm-js/pm-table-pagination.js" th:src="@{/js/pm-js/pm-table-pagination.js}"></script>
<script src="../../static/js/pm-js/pm-reportes.js" th:src="@{/js/pm-js/pm-reportes.js}"></script>
</body>
</html>
